version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Montevideo"

    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    open-pull-requests-limit: 5
